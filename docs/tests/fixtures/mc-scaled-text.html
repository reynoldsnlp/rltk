<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>MC Scaled Text Fixture</title>
</head>
<body>
  <!-- Mimics Scribd (#66): huge font-size text shrunk by a CSS transform. -->
  <div id="layer" style="transform: scale(0.2); transform-origin: 0 0;">
    <p style="font-size: 139px; white-space: nowrap;">Катя идёт к доске, а Маша смотрит в окно. На столе лежит книга.</p>
    <p style="font-size: 139px; white-space: nowrap;">Это мой дом. У нас есть машина. Я вижу город и парк.</p>
  </div>
</body>
</html>
