вать землю, она не станет более давать силы своей для тебя; ты будешь изгнанником и скитальцем на земле. 13 И сказал Каин Господу: наказание мое больше, нежели снести можно; 14 вот, Ты теперь сгоняешь меня с лица земли, и от лица Твоего я скроюсь, и буду изгнанником и скитальцем на земле; и всякий, кто встретится со мною, убьет меня. 15 И сказал ему Господь: за то всякому, кто убьет Каина, отмстится всемеро. И сделал Господь Каину знамение, чтобы никто, встретившись с ним, не убил его. 16 И пошел Каин от лица Господня и поселился в земле Нод, на восток от Едема. 17 И познал Каин жену свою; и она зачала и родила Еноха. И построил он город; и назвал город по имени сына своего: Енох. 18 У Еноха родился Ирад; Ирад родил Мехиаеля; Мехиаель родил Мафусала; Мафусал родил Ламеха. 19 И взял себе Ламех две жены: имя одной: Ада, и имя второй: Цилла. 20 Ада родила Иавала: он был отец живущих в шатрах со стадами. 21 Имя брату его Иувал: он был отец всех играющих на гуслях и свирели. 22 Цилла также родила Тувалкаина, который был ковачом всех орудий из меди и железа. И сестра Тувалкаина Ноема. 23 И сказал Ламех женам своим: Ада и Цилла! послушайте голоса моего; жены Ламеховы! внимайте словам моим: я убил мужа в язву мне и отрока в рану мне; 24 если за Каина отмстится всемеро, то за Ламеха в семьдесят раз всемеро. 25 И познал Адам еще жену свою, и она родила сына, и нарекла ему имя: Сиф, потому что, [говорила она], Бог положил мне другое семя, вместо Авеля, которого убил Каин. 26 У Сифа также родился сын, и он нарек ему имя: Енос; тогда начали призывать имя Господа. \n\n\n\n\n            \n            \nNext\nБытие 3Бытие 5Next\n        \n        \n    dropdown\n\n  \n    \n      \nRussian Synodal Version (RUSV)  by Public Domain\n    \n  \n     \n    \n      \n        PLUS This is where free reading meets deeper study. Continue ad-free with Bible Gateway Plus and gain full access to trusted Study Bibles, commentaries, dictionaries, and more—directly connected to the passage you’re
