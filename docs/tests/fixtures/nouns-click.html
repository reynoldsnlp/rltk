<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RLTK Nouns Link Fixture</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .case { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <h1>Nouns Click With Links</h1>
    <p class="case">
        <span class="label">Linked noun</span><br>
        Открой <a href="https://example.com" id="test-link">страницу <strong>дом</strong></a> чтобы проверить клик.
    </p>
    <p class="case">
        <span class="label">Regular nouns</span><br>
        Это просто <strong>книга</strong> и <strong>окно</strong> для сравнения.
    </p>
</body>
</html>
