<div>
  <h3>Short-form Adjectives (краткая форма)</h3>
  <ol>
    <li>Used as a predicate to indicate a temporary state or quality: "Он болен" <i>He is (currently) sick</i> vs "Он больной" <i>He is (generally / chronically) sick</i>.</li>
    <li>Endings mark only gender or number.</li>
  </ol>
</div>
