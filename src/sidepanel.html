<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RLTK – Russian Language ToolKit</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div id="rltk-sidepanel">

        <nav class="tab-navigation">
            <button class="tab-button active" data-tab="interact">Interact</button>
            <button class="tab-button" data-tab="grammar-explorer">Grammar Explorer</button>
            <button class="tab-button" data-tab="writing">Writing tutor</button>
        </nav>

        <div id="interact-tab" class="tab-content active">
            <!-- TODO add auto-enhance? -->
            <!-- <div class="panel-section">
                <label for="auto-enhance">Auto-enhance:</label>
                <input type="checkbox" id="auto-enhance" name="auto-enhance">
            </div> -->

            <div class="panel-section">
                <label for="topic-menu">Topic:</label>
                <select id="topic-menu" name="topic">
                    <option value="unselected">Select a topic...</option>
                    <option value="adjectives">Adjectives</option>
                    <option value="gerunds">Verbal adverbs / Gerunds</option>
                    <option value="nouns">Nouns</option>
                    <option value="participles">Participles</option>
                    <option value="phonetics">Phonetics</option>
                    <option value="prepositions">Prepositions</option>
                    <option value="verb-aspect-pairs">Verbal aspect</option>
                    <option value="verb-tense">Verb tense</option>
                    <option value="verbs">Verbs</option>
                    <option value="word-stress">Word stress</option>
                </select>
            </div>

            <div class="panel-section" id="filter-section" style="display: none;">
                <label for="filter-menu">Filter:</label>
                <select id="filter-menu" name="filter">
                    <option value="all">No filter</option>
                    <option value="unselected">Select filter...</option>
                </select>
            </div>

            <div class="panel-section" style="display: none;">
                <label for="activity-menu">Activity:</label>
                <select id="activity-menu" name="activity">
                    <option value="unselected">Pick an Activity</option>
                </select>
            </div>

            <div class="panel-actions">
                <div id="button-container" class="button-container">
                    <button id="enhance-button" disabled>Enhance</button>
                    <button id="restore-button" disabled>Restore</button>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <span>Processing...</span>
            </div>
        </div>

        <div id="grammar-explorer-tab" class="tab-content">
            <div class="sub-tab-navigation">
                <button class="sub-tab-button active" data-subtab="word-details">Word details</button>
                <button class="sub-tab-button" data-subtab="morphology">Morphology</button>
            </div>

            <div id="word-details-subtab" class="sub-tab-content active">
                <div class="panel-section" id="grammar-explorer-instructions" style="position: relative;">
                    <button id="dismiss-instructions" style="position: absolute; top: 5px; right: 5px; border: none; background: none; cursor: pointer; font-size: 16px; color: #666;">&times;</button>
                    <p style="margin-right: 20px;">Select a word in the text to see its grammatical analysis.</p>
                </div>
                <div id="grammar-explorer-results" class="results-container">
                    <!-- Results will be displayed here -->
                </div>
            </div>

            <div id="morphology-subtab" class="sub-tab-content" style="display: none;">
                <div class="panel-section">
                    <label><input type="checkbox" id="ignore-ambiguity"> Ignore unresolved ambiguity</label>
                </div>
                <div id="morphology-filters">
                    <!-- Categories and tags will be generated here -->
                </div>
            </div>
        </div>

        <div id="writing-tab" class="tab-content">
            <div class="panel-section">
                <textarea id="writing-input" class="writing-textarea" placeholder="Type or paste text here..."></textarea>
                <div class="button-container right-align">
                    <button id="writing-analyze-button" class="primary-button">Analyze</button>
                </div>
            </div>

            <div id="writing-container" class="writing-container" style="display: none;">
                <div id="writing-results" class="writing-results"></div>
                <div id="writing-details" class="writing-details"></div>
            </div>
        </div>
    </div>

    <div id="access-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Access Required</h3>
            <p>To interact with this page, the Russian Language ToolKit needs permission to access it.</p>
            <p>Click the RLTK icon (<img src="resources/img/RLTK-16x16.png" style="vertical-align: middle; width: 16px; height: 16px;">) in the toolbar to give access.</p>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
