image: reynoldsnlp/view-build:latest

stages:
  - build
  - test
  - package
  - image

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

variables:
  # This will supress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

before_script:
  - cd $CI_PROJECT_DIR/dependencies
  - make

build:
  stage: build
  script:
    - cd $CI_PROJECT_DIR/app
    - mvn compile
  artifacts:
    when: on_success
    expire_in: 2hrs
    paths:
      - ./app/target

test:
  stage: test
  script:
    - cd $CI_PROJECT_DIR/app
    - mvn test

war:
  stage: package
  script:
    - cd ${CI_PROJECT_DIR}/app && mvn -Dmaven.test.skip=true package
  artifacts:
    when: on_success
    expire_in: 2 hrs
    name: view.zip
    paths:
      - ./app/target/VIEW.war

.docker-setup: &docker-template
  stage: image
  before_script: []
  cache: {}
  dependencies:
    - war
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    CI_REGISTRY_IMAGE: view/core
  before_script:
    - cd ${CI_PROJECT_DIR}/docker/view
    - unzip ../../app/target/VIEW.war
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json

gitlab-registry-commit-ref:
  <<: *docker-template
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR/docker --dockerfile $CI_PROJECT_DIR/docker/Dockerfile --destination $CI_REGISTRY/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

gitlab-registry-latest:
  <<: *docker-template
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR/docker --dockerfile $CI_PROJECT_DIR/docker/Dockerfile --destination $CI_REGISTRY/$CI_REGISTRY_IMAGE:latest
  only:
    - master

gitlab-registry-tag:
  <<: *docker-template
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR/docker --dockerfile $CI_PROJECT_DIR/docker/Dockerfile --destination $CI_REGISTRY/$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  only:
    - tags
