name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Chromium crash directory
        run: |
          mkdir -p /tmp/chrome-crash
          touch /tmp/chrome.log
          chmod 666 /tmp/chrome.log

      - name: Run tests (headed Chromium via Xvfb)
        env:
          DEBUG: pw:browser,pw:protocol
          PWTEST_REPORTER: line
          CHROME_CRASH_DIR: /tmp/chrome-crash
          PW_HEADLESS: "1"
        run: |
          ulimit -c unlimited || true
          npx playwright test --workers=1 --retries=0 --trace=retain-on-failure

      - name: Dump browser debug info
        if: always()
        run: |
          echo "=== /tmp contents ==="
          ls -la /tmp || true
          echo "=== chrome.log tail ==="
          if [ -f /tmp/chrome.log ]; then
            tail -n 200 /tmp/chrome.log
          else
            echo "chrome.log not found"
          fi
          echo "=== chrome crash dumps ==="
          if [ -d /tmp/chrome-crash ]; then
            find /tmp/chrome-crash -maxdepth 2 -type f -ls || true
          else
            echo "/tmp/chrome-crash not found"
          fi
          echo "=== disk ==="
          df -h || true
          echo "=== memory ==="
          free -m || true
          echo "=== dmesg (tail) ==="
          sudo dmesg | tail -n 200 || true
          echo "=== journalctl -k (tail) ==="
          sudo journalctl -k --no-pager -n 200 || true
          echo "=== coredumpctl (tail) ==="
          sudo coredumpctl list --no-pager | tail -n 200 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
            /tmp/chrome.log
            /tmp/chrome-crash
